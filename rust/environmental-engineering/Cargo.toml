[package]
name = "environmental-engineering-ai999x"
description = "Environmental Engineering by AI999X: offline answers, checked against the package they were translated from (Rust build)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "environmental-engineering"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
# rlib for the command line; cdylib is the browser module (cargo build --target wasm32-unknown-unknown)
crate-type = ["rlib", "cdylib"]

[features]
# the 1.6 language layer (a trained encoder run with candle): `environmental-engineering lang <model folder> [--json] < questions`
lang = ["dep:ax-lang"]

[dependencies]
ax-engine = { path = "../ax-engine" }
ax-lang = { path = "../ax-lang", optional = true }
serde_json = "1"
